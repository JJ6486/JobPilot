[alembic]
# Paths and the database URL are set in code (app/db/session.py:init_db); these are defaults
# for running `alembic` by hand from backend/.
script_location = app/db/migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url = sqlite:///../data/jobpilot.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
